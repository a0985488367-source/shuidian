<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eef1f0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="水電工地帳">
<title>水電工地帳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
html { color-scheme: light } body { margin: 0; padding-top: env(safe-area-inset-top, 0px) } [hidden] { display: none !important }
/* 版面：上面「工單／庫存」兩頁切換，底部一顆大按鈕新增；表單從下方滑出（單手操作）。工單照老闆 LINE 上的寫法排 */
:root {
  --bg: #eef1f0;
  --panel: #ffffff;
  --ink: #18262b;
  --muted: #5d6d72;
  --line: #d5dcdb;
  --accent: #1f5e8c;      /* 管線藍 */
  --accent-ink: #ffffff;
  --tape: #e3b12a;        /* 電火布黃 */
  --tape-soft: #fbf1d3;
  --out: #b4452f;
  --in: #2c7a4b;
  --font-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #101719; --panel: #182226; --ink: #e5ecec; --muted: #93a3a6; --line: #2a3a3f;
  --accent: #5aa3d6; --accent-ink: #0b1a24; --tape: #e8bd45; --tape-soft: #3a3118;
  --out: #e07a62; --in: #5fbf86; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #101719; --panel: #182226; --ink: #e5ecec; --muted: #93a3a6; --line: #2a3a3f;
  --accent: #5aa3d6; --accent-ink: #0b1a24; --tape: #e8bd45; --tape-soft: #3a3118;
  --out: #e07a62; --in: #5fbf86; color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5 }
.wrap { max-width: 640px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 14px 120px }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums }
button, input, select, textarea { font: inherit; color: inherit }
button { cursor: pointer }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.muted { color: var(--muted) }
.pos { color: var(--in) } .neg { color: var(--out) }

.top { display: flex; align-items: center; gap: 10px }
.top h1 { font-size: 20px; font-weight: 900; margin: 0; flex: 1 }
.top button { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 6px 12px; font-size: 13px }
.sample { margin-top: 12px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; background: var(--tape-soft); border: 1px dashed var(--tape); border-radius: 8px; padding: 10px 12px; font-size: 13px }
.sample button { margin-left: auto; border: 0; background: var(--ink); color: var(--bg); border-radius: 6px; padding: 6px 10px; font-size: 13px }

.tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 4px; margin-top: 14px }
.tabs button { border: 0; background: none; border-radius: 9px; padding: 10px; font-weight: 900; font-size: 16px; color: var(--muted) }
.tabs button[aria-selected="true"] { background: var(--ink); color: var(--bg) }

.head { display: flex; align-items: center; gap: 8px; margin: 16px 0 10px }
.head .sp { flex: 1 }
.month { display: flex; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 8px }
.month button { border: 0; background: none; padding: 6px 12px; color: var(--muted); font-size: 16px; line-height: 1 }
.month span { font-weight: 700; font-size: 14px; min-width: 90px; text-align: center }

.sumcard { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px 10px }
.sumcard div { min-width: 0 }
.sumcard small { display: block; color: var(--muted); font-size: 12px }
.sumcard b { font-size: clamp(15px, 4.4vw, 19px); font-weight: 600; white-space: nowrap }
.sumcard .note { grid-column: 1 / -1; color: var(--muted); font-size: 12px; border-top: 1px solid var(--line); padding-top: 8px; margin-top: 6px }

.list { margin-top: 12px; display: grid; gap: 10px }
.empty { padding: 28px 16px; text-align: center; color: var(--muted); background: var(--panel); border: 1px dashed var(--line); border-radius: 12px }
.card { display: block; width: 100%; text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px }
.card .r1 { display: flex; gap: 10px; align-items: baseline }
.card .t { font-weight: 700; flex: 1; min-width: 0; font-size: 16px }
.card .v { font-weight: 600; white-space: nowrap }
.card .r2 { color: var(--muted); font-size: 13px; margin-top: 2px }
.card .r3 { display: flex; gap: 12px; color: var(--muted); font-size: 12px; margin-top: 6px; flex-wrap: wrap }
.card .big { font-size: 22px; font-weight: 600; white-space: nowrap }

.dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; background: var(--panel); border-top: 1px solid var(--line); padding-top: 10px; padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
.dock button { display: block; width: 100%; max-width: 608px; margin: 0 auto; border: 0; border-radius: 12px; padding: 14px; font-weight: 900; font-size: 17px; background: var(--accent); color: var(--accent-ink) }

.scrim { position: fixed; inset: 0; background: rgba(10, 18, 20, .45); z-index: 20; display: flex; align-items: flex-end; justify-content: center }
.sheet { background: var(--panel); width: 100%; max-width: 560px; max-height: 94%; overflow-y: auto; border-radius: 16px 16px 0 0; padding-top: 18px; padding-bottom: calc(18px + env(safe-area-inset-bottom, 0px)); padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px)) }
.sheet h2 { margin: 0 0 12px; font-size: 18px }
.sec { margin: 18px 0 8px; font-size: 14px; font-weight: 900; display: flex; align-items: baseline; gap: 8px }
.sec small { font-weight: 500; color: var(--muted) }
.field { display: grid; gap: 4px; margin-bottom: 12px }
.field > label { font-size: 13px; color: var(--muted) }
input.in, select.in { width: 100%; min-width: 0; padding: 11px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg) }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 10px }
.err { color: var(--out); font-size: 13px; margin: 0 0 10px }
.hint { font-size: 12px; color: var(--muted); margin: 4px 0 0 }
.btnrow { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px }
.btn { border: 0; border-radius: 8px; padding: 12px 14px; font-weight: 700; background: var(--accent); color: var(--accent-ink) }
.btn.main { flex: 1 }
.btn.ghost { background: none; border: 1px solid var(--line); color: var(--ink) }
.btn.danger { background: var(--out); color: var(--panel) }

/* 工單表單的一行：名稱｜數量｜成本｜刪除 */
.row { display: grid; grid-template-columns: 1fr 52px 84px 34px; gap: 6px; align-items: center; margin-bottom: 6px }
.row.two { grid-template-columns: 1fr 110px 34px }
.row .del { border: 1px solid var(--line); background: none; border-radius: 8px; height: 42px; color: var(--muted) }
.row .info { grid-column: 1 / -1; font-size: 12px; color: var(--accent); margin: -2px 0 4px }
.row .info.bad { color: var(--out) }
.colhead { display: grid; grid-template-columns: 1fr 52px 84px 34px; gap: 6px; font-size: 12px; color: var(--muted); margin-bottom: 4px }
.add { border: 1px dashed var(--accent); color: var(--accent); background: none; border-radius: 8px; padding: 9px; width: 100%; font-weight: 700 }
.labor { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center }
.total { background: var(--bg); border-radius: 10px; padding: 12px 14px; margin: 18px 0 4px; display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; font-size: 14px }
.total .net { font-weight: 900; font-size: 18px; border-top: 1px solid var(--line); padding-top: 6px; margin-top: 4px }

/* 工單明細：照 LINE 的寫法 */
.slip { background: var(--bg); border-radius: 12px; padding: 14px 16px; font-size: 16px; line-height: 1.7; white-space: pre-wrap; word-break: break-word }
.slip .h { font-weight: 900 }
.slip .k { color: var(--muted) }
.slip hr { border: 0; border-top: 2px solid var(--line); width: 90px; margin: 6px 0 }
.slip .net { font-weight: 900; font-size: 18px }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; font-size: 15px; margin: 0 0 6px }
.kv dt { color: var(--muted) }
.kv dd { margin: 0; text-align: right }
.tbl { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 6px }
.tbl td { padding: 6px 2px; border-bottom: 1px dashed var(--line) }
.tbl td.r { text-align: right; white-space: nowrap }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(86px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 8px; font-size: 14px; z-index: 30; max-width: calc(100% - 32px) }
textarea.in { width: 100%; min-height: 80px; border: 1px solid var(--line); border-radius: 8px; padding: 8px; background: var(--bg); font-family: var(--font-num); font-size: 12px }
@media (prefers-reduced-motion: no-preference) { .sheet { animation: up .18s ease-out } @keyframes up { from { transform: translateY(24px); opacity: .6 } } }
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><h1>水電工地帳</h1><button id="backupBtn" type="button">備份</button></div>
  <div class="sample" id="sampleBar" hidden>
    <span>現在是<b>範例資料</b>，可以先點點看。</span>
    <button id="clearSample" type="button">清空範例，開始用</button>
  </div>
  <div class="tabs" role="tablist">
    <button type="button" role="tab" data-tab="orders">工單</button>
    <button type="button" role="tab" data-tab="stock">庫存</button>
  </div>
  <main id="view"></main>
</div>
<div class="dock"><button type="button" id="mainBtn"></button></div>
<div class="scrim" id="scrim" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" hidden></div>

<script>
(function () {
  var KEY = 'shuidian-inventory-v1';
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var r2 = function (n) { return Math.round((n || 0) * 100) / 100; };
  // 畫面上的金額：$3,150；LINE 文字照老闆寫法：3150$
  var money = function (n) { return (n < 0 ? '−' : '') + '$' + Math.abs(Math.round(n || 0)).toLocaleString('zh-TW'); };
  var plain = function (n) { return String(r2(n)); };
  var qtyFmt = function (n) { return r2(n).toLocaleString('zh-TW', { maximumFractionDigits: 2 }); };
  var uid = function () { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); };
  var pad = function (n) { return String(n).padStart(2, '0'); };
  var today = function () { var d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
  var WD = ['日', '一', '二', '三', '四', '五', '六'];
  var dayLabel = function (s) { var d = new Date(s + 'T12:00:00'); return (d.getMonth() + 1) + '/' + d.getDate() + '（' + WD[d.getDay()] + '）'; };
  var EMPTY = function () { return { items: [], logs: [], orders: [], rate: 1500 }; };

  function sampleData() {
    var s = { sample: true, items: [], logs: [], orders: [], rate: 1500 };
    [['b', '8平方電線（黑）', '米', 100, 5149], ['r', '8平方電線（紅）', '米', 100, 5149], ['w', '2.0 單芯電線', '米', 100, 1350], ['t', 'T8 LED 白光燈管 2尺', '支', 10, 750]].forEach(function (r, i) {
      s.items.push({ id: 'ex' + r[0], name: r[1], unit: r[2] });
      s.logs.push({ id: 'exl' + i, t: Date.parse('2026-10-01T08:00:00') + i, date: '2026-10-01', type: 'in', itemId: 'ex' + r[0], qty: r[3], price: r[4] / r[3], total: r[4], job: '', note: '' });
    });
    s.orders.push({ id: 'exo1', date: '2026-10-16', addr: '（範例）鹽埕區某某街 1 號', income: 3150,
      lines: [{ name: '喇叭鎖', qty: 2, cost: 498 }, { name: '面盆排桿', qty: 1, cost: 150 }, { name: 'T8 LED 白光燈管 2尺', qty: 1, itemId: 'ext', cost: 75 }],
      labor: { n: 1, rate: 1500 }, extras: [] });
    s.orders.push({ id: 'exo2', date: '2026-10-17', addr: '（範例）三民區某某路 2 號 冷氣迴路', income: 4800,
      lines: [{ name: '8平方電線（黑）', qty: 10, itemId: 'exb', cost: 514.9 }, { name: '8平方電線（紅）', qty: 10, itemId: 'exr', cost: 514.9 }, { name: '無熔絲開關 2P 30A', qty: 1, cost: 450 }],
      labor: { n: 1, rate: 1500 }, extras: [{ name: '飲料', amount: 120 }] });
    s.orders.forEach(function (o, k) { o.lines.forEach(function (l, i) { if (l.itemId) s.logs.push({ id: 'exu' + k + i, t: Date.parse(o.date + 'T12:00:00') + i, date: o.date, type: 'out', itemId: l.itemId, qty: l.qty, price: 0, job: o.addr, orderId: o.id }); }); });
    return s;
  }

  var state;
  try { state = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { state = null; }
  if (!state || !Array.isArray(state.items) || !Array.isArray(state.logs) || state.sample) state = sampleData();
  if (!Array.isArray(state.orders)) state.orders = [];
  if (!state.rate) state.rate = 1500;
  function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }

  // ---------- 庫存：用進出紀錄算剩多少、平均每單位成本 ----------
  var calc;
  function compute(skipOrder) {
    var by = {};
    state.items.forEach(function (it) { by[it.id] = { qty: 0, avg: 0, lastIn: null }; });
    state.logs.slice().sort(function (a, b) { return a.t - b.t; }).forEach(function (l) {
      var c = by[l.itemId]; if (!c || (skipOrder && l.orderId === skipOrder)) return;
      if (l.type === 'in') { var tot = c.qty * c.avg + l.qty * l.price; c.qty += l.qty; c.avg = c.qty > 0 ? tot / c.qty : l.price; if (!l.adj) c.lastIn = l; }
      else c.qty -= l.qty;
    });
    return by;
  }
  function itemById(id) { for (var i = 0; i < state.items.length; i++) if (state.items[i].id === id) return state.items[i]; return null; }
  function itemByName(n) { n = n.trim(); for (var i = 0; i < state.items.length; i++) if (state.items[i].name === n) return state.items[i]; return null; }

  // ---------- 工單 ----------
  function orderCost(o) {
    var c = 0;
    o.lines.forEach(function (l) { c += l.cost || 0; });
    if (o.labor && o.labor.n) c += o.labor.n * o.labor.rate;
    (o.extras || []).forEach(function (x) { c += x.amount || 0; });
    return c;
  }
  // 照老闆 LINE 的寫法
  function orderText(o) {
    var t = [o.addr, ''];
    if (o.lines.length) { t.push('更換：'); o.lines.forEach(function (l) { var it = l.itemId && itemById(l.itemId); t.push(l.name + '*' + qtyFmt(l.qty) + (it && it.unit !== '個' && it.unit !== '支' ? it.unit : '')); }); }
    t.push('實收：' + plain(o.income) + '$', '成本：');
    o.lines.forEach(function (l) { if (l.cost) t.push(l.name + plain(l.cost) + '$'); });
    if (o.labor && o.labor.n) t.push(qtyFmt(o.labor.n) + '工' + plain(o.labor.n * o.labor.rate) + '$');
    (o.extras || []).forEach(function (x) { if (x.amount) t.push(x.name + plain(x.amount) + '$'); });
    t.push('————', '公司淨收：' + plain(o.income - orderCost(o)) + '$');
    return t.join('\n');
  }

  // ---------- 畫面 ----------
  var tab = 'orders', month = today().slice(0, 7);
  try { tab = localStorage.getItem(KEY + ':tab2') || 'orders'; } catch (e) {}
  if (tab !== 'stock') tab = 'orders';

  function render() {
    calc = compute();
    $('sampleBar').hidden = !state.sample;
    document.querySelectorAll('.tabs button').forEach(function (b) { b.setAttribute('aria-selected', String(b.dataset.tab === tab)); });
    $('mainBtn').textContent = tab === 'orders' ? '＋ 新工單' : '＋ 新增材料';
    $('view').innerHTML = tab === 'orders' ? viewOrders() : viewStock();
  }

  function viewOrders() {
    var os = state.orders.filter(function (o) { return o.date.slice(0, 7) === month; }).sort(function (a, b) { return b.date.localeCompare(a.date); });
    var inc = 0, cost = 0;
    os.forEach(function (o) { inc += o.income; cost += orderCost(o); });
    return '<div class="head"><span class="sp"></span><div class="month"><button type="button" data-mon="-1" aria-label="上個月">‹</button><span>' + month.slice(0, 4) + ' 年 ' + Number(month.slice(5)) + ' 月</span><button type="button" data-mon="1" aria-label="下個月">›</button></div></div>' +
      '<div class="sumcard"><div><small>實收</small><b class="num">' + money(inc) + '</b></div><div><small>成本</small><b class="num">' + money(cost) + '</b></div><div><small>公司淨收</small><b class="num ' + (inc - cost >= 0 ? 'pos' : 'neg') + '">' + money(inc - cost) + '</b></div>' +
      '<div class="note">這個月 ' + os.length + ' 張工單</div></div>' +
      '<div class="list">' + (os.length ? os.map(function (o) {
        var net = o.income - orderCost(o);
        return '<button class="card" type="button" data-order="' + o.id + '"><div class="r1"><span class="t">' + esc(o.addr) + '</span><span class="v num ' + (net >= 0 ? 'pos' : 'neg') + '">淨收 ' + money(net) + '</span></div>' +
          '<div class="r2">' + esc(o.lines.map(function (l) { return l.name + '*' + qtyFmt(l.qty); }).join('、') || '（沒填更換項目）') + '</div>' +
          '<div class="r3"><span>' + dayLabel(o.date) + '</span><span>實收 ' + money(o.income) + '</span><span>成本 ' + money(orderCost(o)) + '</span></div></button>';
      }).join('') : '<div class="empty">這個月還沒有工單。<br>按下面「＋ 新工單」開始記。</div>') + '</div>';
  }

  function viewStock() {
    var value = 0;
    state.items.forEach(function (it) { var c = calc[it.id]; value += Math.max(c.qty, 0) * c.avg; });
    var items = state.items.slice().sort(function (a, b) { return a.name.localeCompare(b.name, 'zh-Hant'); });
    return '<div class="sumcard" style="margin-top:16px;grid-template-columns:1fr 1fr"><div><small>庫存材料</small><b class="num">' + state.items.length + ' 樣</b></div><div><small>庫存總值</small><b class="num">' + money(value) + '</b></div></div>' +
      '<div class="list">' + (items.length ? items.map(function (it) {
        var c = calc[it.id], li = c.lastIn;
        return '<button class="card" type="button" data-item="' + it.id + '"><div class="r1"><span class="t">' + esc(it.name) + '</span><span class="v">剩餘 <span class="big num ' + (c.qty <= 0 ? 'neg' : '') + '">' + qtyFmt(c.qty) + '</span> ' + esc(it.unit) + '</span></div>' +
          '<div class="r3"><span>1' + esc(it.unit) + ' <b class="num" style="color:var(--ink)">' + plain(c.avg) + '$</b></span>' +
          (li ? '<span>上次進貨 ' + qtyFmt(li.qty) + esc(it.unit) + '・' + plain(li.total != null ? li.total : li.qty * li.price) + '$</span>' : '') + '</div></button>';
      }).join('') : '<div class="empty">還沒有庫存材料。<br>按下面「＋ 新增材料」，例如：8平方電線（黑）100 米 5149 元。</div>') + '</div>';
  }

  // ---------- 下方滑出表單 ----------
  function open(html, onReady) { $('sheet').innerHTML = html; $('scrim').hidden = false; $('sheet').scrollTop = 0; if (onReady) onReady(); }
  function close() { $('scrim').hidden = true; $('sheet').innerHTML = ''; }
  $('scrim').addEventListener('click', function (e) { if (e.target === $('scrim')) close(); });
  $('sheet').addEventListener('click', function (e) { if (e.target.closest('[data-close]')) close(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !$('scrim').hidden) close(); });
  var toastTimer;
  function toast(m) { var t = $('toast'); t.textContent = m; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.hidden = true; }, 2600); }
  function leaveSample() { if (state.sample) state = EMPTY(); }
  function commit(m) { delete state.sample; save(); render(); close(); if (m) toast(m); }
  function showErr(m) { $('fErr').textContent = m; $('fErr').hidden = false; }
  var btns = function (label) { return '<p class="err" id="fErr" hidden></p><div class="btnrow"><button class="btn main" type="submit">' + label + '</button><button class="btn ghost" type="button" data-close>取消</button></div>'; };
  function copyText(text, okMsg) {
    var fallback = function () {
      open('<h2>請手動複製</h2><p class="hint" style="margin:0 0 8px">長按下面文字全選後複製。</p><textarea class="in" id="cpy" style="min-height:240px" readonly></textarea><div class="btnrow"><button class="btn ghost" type="button" data-close>關閉</button></div>', function () { $('cpy').value = text; $('cpy').select(); });
    };
    try { navigator.clipboard.writeText(text).then(function () { toast(okMsg); }, fallback); } catch (e) { fallback(); }
  }
  function confirmSheet(title, body, yes, fn) {
    open('<h2>' + title + '</h2><p style="margin:0 0 14px;color:var(--muted)">' + body + '</p><div class="btnrow"><button class="btn danger" type="button" id="cYes">' + yes + '</button><button class="btn ghost" type="button" data-close>取消</button></div>', function () { $('cYes').onclick = fn; });
  }

  // 工單明細（跟 LINE 上一樣的排法）
  function orderSheet(id) {
    var o = state.orders.filter(function (x) { return x.id === id; })[0]; if (!o) return;
    var net = o.income - orderCost(o);
    var h = '<div class="h">' + esc(o.addr) + '</div><span class="k">' + dayLabel(o.date) + '</span>\n\n';
    if (o.lines.length) h += '<span class="k">更換：</span>\n' + o.lines.map(function (l) { var it = l.itemId && itemById(l.itemId); return esc(l.name) + '*' + qtyFmt(l.qty) + (it && it.unit !== '個' && it.unit !== '支' ? esc(it.unit) : ''); }).join('\n') + '\n';
    h += '<span class="k">實收：</span><b class="num">' + plain(o.income) + '$</b>\n<span class="k">成本：</span>\n';
    o.lines.forEach(function (l) { if (l.cost) h += esc(l.name) + ' <span class="num">' + plain(l.cost) + '$</span>' + (l.itemId ? ' <small class="muted">（庫存）</small>' : '') + '\n'; });
    if (o.labor && o.labor.n) h += qtyFmt(o.labor.n) + '工 <span class="num">' + plain(o.labor.n * o.labor.rate) + '$</span>\n';
    (o.extras || []).forEach(function (x) { if (x.amount) h += esc(x.name) + ' <span class="num">' + plain(x.amount) + '$</span>\n'; });
    h += '<hr><span class="net">公司淨收：<span class="num ' + (net >= 0 ? 'pos' : 'neg') + '">' + plain(net) + '$</span></span>';
    open('<div class="slip">' + h + '</div>' +
      '<div class="btnrow"><button class="btn main" type="button" id="oCopy">複製（貼到 LINE）</button></div>' +
      '<div class="btnrow"><button class="btn ghost main" type="button" id="oEdit">修改</button><button class="btn ghost main" type="button" id="oDel">刪除</button></div>', function () {
      $('oCopy').onclick = function () { copyText(orderText(o), '已複製，可以貼到 LINE'); };
      $('oEdit').onclick = function () { orderForm(o); };
      $('oDel').onclick = function () {
        confirmSheet('刪除這張工單？', '從庫存拿的材料會加回庫存。', '刪除', function () {
          state.orders = state.orders.filter(function (x) { return x.id !== id; });
          state.logs = state.logs.filter(function (l) { return l.orderId !== id; });
          commit('已刪除工單');
        });
      };
    });
  }

  // 新增／修改工單
  function orderForm(o) {
    var ed = !!o;
    o = o || { date: today(), addr: '', income: '', lines: [], labor: { n: 1, rate: state.rate }, extras: [] };
    var stock = compute(ed ? o.id : null); // 修改時，這張工單原本扣掉的先加回來
    var opts = state.items.map(function (it) { return '<option value="' + esc(it.name) + '">'; }).join('');
    open('<h2>' + (ed ? '修改工單' : '新工單') + '</h2><form id="f" autocomplete="off">' +
      '<div class="field"><label for="oAddr">地址／客戶</label><input class="in" id="oAddr" type="text" value="' + esc(o.addr) + '" placeholder="例：鹽埕區新興街 295 號"></div>' +
      '<div class="grid2"><div class="field"><label for="oDate">日期</label><input class="in" id="oDate" type="date" value="' + o.date + '"></div>' +
      '<div class="field"><label for="oInc">實收（跟客人收）</label><input class="in" id="oInc" type="number" inputmode="numeric" min="0" step="any" value="' + (o.income === '' ? '' : o.income) + '" placeholder="例：3150"></div></div>' +
      '<div class="sec">更換／用了什麼 <small>庫存的材料打名字會自動算成本、扣庫存</small></div>' +
      '<div class="colhead"><span>名稱</span><span>數量</span><span>成本（元）</span><span></span></div><div id="lines"></div>' +
      '<button class="add" type="button" id="addLine">＋ 再加一項</button>' +
      '<div class="sec">工錢</div><div class="labor"><input class="in" id="lN" type="number" inputmode="decimal" min="0" step="0.5" value="' + (o.labor ? o.labor.n : 0) + '" aria-label="幾工"><span>工 ×</span><input class="in" id="lR" type="number" inputmode="numeric" min="0" step="any" value="' + (o.labor ? o.labor.rate : state.rate) + '" aria-label="每工多少"></div>' +
      '<p class="hint">例：1 工 × 1500。沒有工錢就填 0。</p>' +
      '<div class="sec">其他成本 <small>飲料、油錢、停車費…</small></div><div id="extras"></div>' +
      '<button class="add" type="button" id="addExtra">＋ 加一筆</button>' +
      '<div class="total"><span>實收</span><span class="num" id="tInc"></span><span>成本</span><span class="num" id="tCost"></span><span class="net">公司淨收</span><span class="net num" id="tNet"></span></div>' +
      '<datalist id="itemsDl">' + opts + '</datalist>' + btns(ed ? '儲存' : '存好工單') + '</form>', function () {
      function addLine(l) {
        l = l || { name: '', qty: 1, cost: '' };
        var d = document.createElement('div'); d.className = 'row';
        d.innerHTML = '<input class="in" type="text" list="itemsDl" placeholder="例：喇叭鎖" aria-label="名稱"><input class="in" type="number" inputmode="decimal" min="0" step="any" aria-label="數量"><input class="in" type="number" inputmode="decimal" min="0" step="any" placeholder="元" aria-label="成本"><button class="del" type="button" aria-label="刪掉這項">✕</button><p class="info" hidden></p>';
        var f = d.querySelectorAll('input'); f[0].value = l.name; f[1].value = l.qty; f[2].value = l.cost === '' || l.cost == null ? '' : r2(l.cost);
        $('lines').appendChild(d);
        f.forEach(function (x) { x.addEventListener('input', sync); });
        d.querySelector('.del').onclick = function () { d.remove(); sync(); };
        sync(); return d;
      }
      function addExtra(x) {
        x = x || { name: '', amount: '' };
        var d = document.createElement('div'); d.className = 'row two';
        d.innerHTML = '<input class="in" type="text" list="extraDl" placeholder="例：飲料" aria-label="名稱"><input class="in" type="number" inputmode="numeric" min="0" step="any" placeholder="元" aria-label="金額"><button class="del" type="button" aria-label="刪掉這筆">✕</button>';
        var f = d.querySelectorAll('input'); f[0].value = x.name; f[1].value = x.amount;
        $('extras').appendChild(d);
        f.forEach(function (i) { i.addEventListener('input', sync); });
        d.querySelector('.del').onclick = function () { d.remove(); sync(); };
        sync(); return d;
      }
      function read() {
        var lines = [], need = {}, bad = '';
        Array.prototype.forEach.call($('lines').children, function (d) {
          var f = d.querySelectorAll('input'), name = f[0].value.trim(), qty = parseFloat(f[1].value) || 0, info = d.querySelector('.info');
          var it = name && itemByName(name);
          if (it) {
            var c = stock[it.id], cost = qty * c.avg;
            need[it.id] = (need[it.id] || 0) + qty;
            f[2].value = qty ? r2(cost) : ''; f[2].readOnly = true;
            var left = c.qty - need[it.id];
            info.hidden = false; info.classList.toggle('bad', left < -1e-9);
            info.textContent = '從庫存扣：1' + it.unit + ' ' + plain(c.avg) + '$，用完剩 ' + qtyFmt(left) + ' ' + it.unit + (left < -1e-9 ? '（不夠！）' : '');
            if (left < -1e-9 && !bad) bad = it.name + ' 庫存只剩 ' + qtyFmt(c.qty) + ' ' + it.unit + '，不夠用。先到「庫存」補貨。';
            if (name) lines.push({ name: it.name, qty: qty, itemId: it.id, cost: r2(cost) });
          } else {
            f[2].readOnly = false; info.hidden = true;
            if (name) lines.push({ name: name, qty: qty, cost: parseFloat(f[2].value) || 0 });
          }
        });
        var extras = [];
        Array.prototype.forEach.call($('extras').children, function (d) { var f = d.querySelectorAll('input'); if (f[0].value.trim() || f[1].value) extras.push({ name: f[0].value.trim() || '其他', amount: parseFloat(f[1].value) || 0 }); });
        return { lines: lines, extras: extras, bad: bad, labor: { n: parseFloat($('lN').value) || 0, rate: parseFloat($('lR').value) || 0 }, income: parseFloat($('oInc').value) || 0 };
      }
      function sync() {
        var r = read(), cost = orderCost(r);
        $('tInc').textContent = money(r.income); $('tCost').textContent = money(cost);
        $('tNet').textContent = money(r.income - cost); $('tNet').className = 'net num ' + (r.income - cost >= 0 ? 'pos' : 'neg');
      }
      if (!$('extraDl')) { var dl = document.createElement('datalist'); dl.id = 'extraDl'; dl.innerHTML = '<option value="飲料"><option value="便當"><option value="油錢"><option value="停車費"><option value="工具耗材">'; $('f').appendChild(dl); }
      (o.lines.length ? o.lines : [null]).forEach(addLine);
      (o.extras || []).forEach(addExtra);
      ['oInc', 'lN', 'lR'].forEach(function (k) { $(k).addEventListener('input', sync); });
      $('addLine').onclick = function () { addLine().querySelector('input').focus(); };
      $('addExtra').onclick = function () { addExtra().querySelector('input').focus(); };
      sync();
      if (!ed) $('oAddr').focus();
      $('f').addEventListener('submit', function (e) {
        e.preventDefault();
        var addr = $('oAddr').value.trim(); if (!addr) return showErr('請填地址或客戶。');
        var r = read(); if (r.bad) return showErr(r.bad);
        if (!ed && state.sample) { leaveSample(); r.lines.forEach(function (l) { delete l.itemId; }); } // 範例清掉後，範例庫存的材料改當一般成本
        var rec = ed ? o : { id: uid() };
        rec.date = $('oDate').value || today(); rec.addr = addr; rec.income = r.income; rec.lines = r.lines; rec.labor = r.labor; rec.extras = r.extras;
        if (!ed) state.orders.push(rec);
        if (r.labor.rate) state.rate = r.labor.rate;
        state.logs = state.logs.filter(function (l) { return l.orderId !== rec.id; });
        rec.lines.forEach(function (l, i) { if (l.itemId && l.qty > 0) state.logs.push({ id: uid(), t: Date.parse(rec.date + 'T12:00:00') + i, date: rec.date, type: 'out', itemId: l.itemId, qty: l.qty, price: 0, job: addr, orderId: rec.id }); });
        tab = 'orders'; month = rec.date.slice(0, 7);
        commit((ed ? '已儲存' : '已存好工單') + '，公司淨收 ' + money(rec.income - orderCost(rec)));
      });
    });
  }

  // 新增材料（第一次進貨一起填）
  function itemForm() {
    open('<h2>新增材料</h2><form id="f" autocomplete="off">' +
      '<div class="field"><label for="iName">名稱</label><input class="in" id="iName" type="text" placeholder="例：8平方電線（黑）"></div>' +
      '<div class="grid2"><div class="field"><label for="iQty">買了多少</label><input class="in" id="iQty" type="number" inputmode="decimal" min="0" step="any" placeholder="例：100"></div>' +
      '<div class="field"><label for="iUnit">單位</label><input class="in" id="iUnit" type="text" list="unitDl" value="米"><datalist id="unitDl"><option value="米"><option value="個"><option value="支"><option value="卷"><option value="條"><option value="包"><option value="組"></datalist></div></div>' +
      '<div class="field"><label for="iTotal">總共多少錢</label><input class="in" id="iTotal" type="number" inputmode="decimal" min="0" step="any" placeholder="例：5149"></div>' +
      '<p class="hint" id="iCalc" style="margin:-4px 0 12px"></p>' + btns('新增') + '</form>', function () {
      function sync() { var q = parseFloat($('iQty').value), t = parseFloat($('iTotal').value), u = $('iUnit').value.trim() || '單位'; $('iCalc').textContent = q > 0 && t >= 0 ? '＝ 1' + u + ' ' + plain(t / q) + '$' : '填好會自動算出每' + u + '多少錢。'; }
      ['iQty', 'iUnit', 'iTotal'].forEach(function (k) { $(k).addEventListener('input', sync); }); sync(); $('iName').focus();
      $('f').addEventListener('submit', function (e) {
        e.preventDefault();
        var name = $('iName').value.trim(), unit = $('iUnit').value.trim(), q = parseFloat($('iQty').value), t = parseFloat($('iTotal').value);
        if (!name || !unit) return showErr('名稱和單位都要填。');
        if (itemByName(name) && !state.sample) return showErr('已經有「' + name + '」了，請到那一項按「補貨」。');
        if (!(q > 0)) return showErr('請填買了多少。'); if (!(t >= 0)) return showErr('請填總共多少錢。');
        leaveSample();
        var it = { id: uid(), name: name, unit: unit }; state.items.push(it);
        state.logs.push({ id: uid(), t: Date.now(), date: today(), type: 'in', itemId: it.id, qty: q, price: t / q, total: t, job: '', note: '' });
        tab = 'stock'; commit('已新增 ' + name + '，1' + unit + ' ' + plain(t / q) + '$');
      });
    });
  }

  function itemSheet(id) {
    var it = itemById(id), c = calc[id];
    var hist = state.logs.filter(function (l) { return l.itemId === id; }).sort(function (a, b) { return b.t - a.t; }).slice(0, 12);
    open('<h2>' + esc(it.name) + '</h2><dl class="kv"><dt>剩餘</dt><dd class="num"><b style="font-size:20px">' + qtyFmt(c.qty) + '</b> ' + esc(it.unit) + '</dd>' +
      '<dt>1' + esc(it.unit) + '</dt><dd class="num">' + plain(c.avg) + '$</dd><dt>剩下的值</dt><dd class="num">' + money(Math.max(c.qty, 0) * c.avg) + '</dd></dl>' +
      '<div class="btnrow"><button class="btn main" type="button" id="aIn" style="background:var(--in);color:var(--panel)">＋ 補貨</button><button class="btn ghost" type="button" id="aFix">修正剩餘</button></div>' +
      '<div class="sec">最近進出</div><table class="tbl">' + hist.map(function (l) {
        var txt = l.type === 'in' ? (l.adj ? '盤點加回' : '進貨 ' + plain(l.total != null ? l.total : l.qty * l.price) + '$') : (l.adj ? '盤點扣掉' : (l.job || '用掉'));
        return '<tr><td>' + dayLabel(l.date) + '</td><td>' + esc(txt) + '</td><td class="r num ' + (l.type === 'in' ? 'pos' : 'neg') + '">' + (l.type === 'in' ? '+' : '−') + qtyFmt(l.qty) + ' ' + esc(it.unit) + '</td></tr>';
      }).join('') + '</table>' +
      '<div class="btnrow" style="margin-top:16px"><button class="btn ghost main" type="button" id="aRen">改名稱／單位</button><button class="btn ghost" type="button" id="aDel">刪除</button></div>', function () {
      $('aIn').onclick = function () { restockForm(it); };
      $('aFix').onclick = function () { fixForm(it); };
      $('aRen').onclick = function () { renameForm(it); };
      $('aDel').onclick = function () {
        confirmSheet('刪除「' + esc(it.name) + '」？', '它的進出紀錄會一起刪掉。已經記在工單裡的成本不會變。', '刪除', function () {
          state.items = state.items.filter(function (x) { return x.id !== id; });
          state.logs = state.logs.filter(function (l) { return l.itemId !== id; });
          state.orders.forEach(function (o) { o.lines.forEach(function (l) { if (l.itemId === id) delete l.itemId; }); });
          commit('已刪除');
        });
      };
    });
  }
  function restockForm(it) {
    open('<h2>補貨：' + esc(it.name) + '</h2><form id="f"><div class="grid2"><div class="field"><label for="rQty">買了多少（' + esc(it.unit) + '）</label><input class="in" id="rQty" type="number" inputmode="decimal" min="0" step="any"></div>' +
      '<div class="field"><label for="rTotal">總共多少錢</label><input class="in" id="rTotal" type="number" inputmode="decimal" min="0" step="any"></div></div>' +
      '<div class="field"><label for="rDate">日期</label><input class="in" id="rDate" type="date" value="' + today() + '"></div><p class="hint" id="rCalc" style="margin:-4px 0 12px"></p>' + btns('記錄補貨') + '</form>', function () {
      function sync() { var q = parseFloat($('rQty').value), t = parseFloat($('rTotal').value); $('rCalc').textContent = q > 0 && t >= 0 ? '這批 1' + it.unit + ' ' + plain(t / q) + '$，會跟舊的平均算。' : ''; }
      $('rQty').addEventListener('input', sync); $('rTotal').addEventListener('input', sync); $('rQty').focus();
      $('f').addEventListener('submit', function (e) {
        e.preventDefault();
        var q = parseFloat($('rQty').value), t = parseFloat($('rTotal').value);
        if (!(q > 0)) return showErr('請填買了多少。'); if (!(t >= 0)) return showErr('請填總共多少錢。');
        var d = $('rDate').value || today();
        state.logs.push({ id: uid(), t: Date.parse(d + 'T12:00:00') + (Date.now() % 86400000) / 1000, date: d, type: 'in', itemId: it.id, qty: q, price: t / q, total: t, job: '', note: '' });
        commit('已補貨 ' + it.name + '，現在剩 ' + qtyFmt(calc[it.id].qty + q) + ' ' + it.unit);
      });
    });
  }
  function fixForm(it) {
    var c = calc[it.id];
    open('<h2>修正剩餘：' + esc(it.name) + '</h2><form id="f"><div class="field"><label for="xQty">實際還剩多少（' + esc(it.unit) + '）</label><input class="in" id="xQty" type="number" inputmode="decimal" min="0" step="any" value="' + r2(c.qty) + '"></div>' +
      '<p class="hint" style="margin:-4px 0 12px">量過或數過之後填實際數量，例如零星用掉沒記的。</p>' + btns('修正') + '</form>', function () {
      $('f').addEventListener('submit', function (e) {
        e.preventDefault();
        var q = parseFloat($('xQty').value); if (!(q >= 0)) return showErr('請填數量。');
        var diff = q - c.qty; if (Math.abs(diff) < 1e-9) { close(); return; }
        state.logs.push({ id: uid(), t: Date.now(), date: today(), type: diff > 0 ? 'in' : 'out', itemId: it.id, qty: Math.abs(diff), price: c.avg, job: '', note: '盤點修正', adj: true });
        commit('已修正，' + it.name + ' 剩 ' + qtyFmt(q) + ' ' + it.unit);
      });
    });
  }
  function renameForm(it) {
    open('<h2>改名稱／單位</h2><form id="f"><div class="field"><label for="nName">名稱</label><input class="in" id="nName" type="text" value="' + esc(it.name) + '"></div><div class="field"><label for="nUnit">單位</label><input class="in" id="nUnit" type="text" value="' + esc(it.unit) + '"></div>' + btns('儲存') + '</form>', function () {
      $('f').addEventListener('submit', function (e) {
        e.preventDefault();
        var n = $('nName').value.trim(), u = $('nUnit').value.trim(); if (!n || !u) return showErr('都要填。');
        var other = itemByName(n); if (other && other.id !== it.id) return showErr('已經有叫「' + n + '」的材料了。');
        it.name = n; it.unit = u; commit('已儲存');
      });
    });
  }

  function backupSheet() {
    open('<h2>備份</h2><p class="hint" style="margin:0 0 12px;font-size:13px">資料只存在這支手機的瀏覽器裡。換手機、清除瀏覽器資料前，先複製備份碼貼到 LINE 給自己。</p>' +
      '<div class="btnrow" style="margin-top:0"><button class="btn main" id="bCopy" type="button">複製備份碼</button></div>' +
      '<div class="sec">還原備份</div><textarea class="in" id="bText" placeholder="貼上備份碼"></textarea><p class="err" id="fErr" hidden></p>' +
      '<div class="btnrow"><button class="btn ghost main" id="bRestore" type="button">還原（會蓋掉目前的資料）</button></div>' +
      '<div class="btnrow" style="margin-top:22px"><button class="btn danger" id="bWipe" type="button">全部清空</button><button class="btn ghost main" type="button" data-close>關閉</button></div>', function () {
      $('bCopy').onclick = function () { var s = JSON.parse(JSON.stringify(state)); delete s.sample; copyText(JSON.stringify(s), '已複製備份碼'); };
      $('bRestore').onclick = function () {
        try {
          var s = JSON.parse($('bText').value); if (!s || !Array.isArray(s.items) || !Array.isArray(s.logs)) throw 0;
          if (!Array.isArray(s.orders)) s.orders = [];
          confirmSheet('還原備份？', '目前的資料會被備份裡的 ' + s.orders.length + ' 張工單、' + s.items.length + ' 樣材料取代。', '還原', function () { state = s; commit('已還原'); });
        } catch (e) { showErr('這不是有效的備份碼，請確認整段都有貼上。'); }
      };
      $('bWipe').onclick = function () { confirmSheet('全部清空？', '所有工單和庫存都會刪除，無法復原。建議先複製備份碼。', '全部清空', function () { state = EMPTY(); commit('已全部清空'); }); };
    });
  }

  // ---------- 事件 ----------
  document.querySelector('.tabs').addEventListener('click', function (e) {
    var b = e.target.closest('[data-tab]'); if (!b) return;
    tab = b.dataset.tab; try { localStorage.setItem(KEY + ':tab2', tab); } catch (er) {} render();
  });
  $('mainBtn').addEventListener('click', function () { if (tab === 'orders') orderForm(); else itemForm(); });
  $('backupBtn').addEventListener('click', backupSheet);
  $('clearSample').addEventListener('click', function () { state = EMPTY(); save(); render(); toast('範例已清空，可以開始記了'); });
  $('view').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    if (b.dataset.mon) { var y = Number(month.slice(0, 4)), m = Number(month.slice(5)) + Number(b.dataset.mon); if (m < 1) { m = 12; y--; } if (m > 12) { m = 1; y++; } month = y + '-' + pad(m); render(); }
    else if (b.dataset.order) orderSheet(b.dataset.order);
    else if (b.dataset.item) itemSheet(b.dataset.item);
  });

  render();
})();
</script>
</body>
</html>
